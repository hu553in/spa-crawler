name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    permissions:
      contents: read
    uses: hu553in/common-things/.github/workflows/check-python.yml@main

  docker-crawler:
    permissions:
      contents: read
    uses: hu553in/common-things/.github/workflows/check-docker.yml@main
    with:
      file: ./Dockerfile.spa-crawler
      no_cache_filters: runner
      build: ${{ github.ref != 'refs/heads/main' }}
      smoke_command: &python_smoke |
        /app/.venv/bin/python --version
        /app/.venv/bin/python -m spa_crawler --help

  docker-site:
    permissions:
      contents: read
    uses: hu553in/common-things/.github/workflows/check-docker.yml@main
    with:
      file: ./Dockerfile.spa
      no_cache_filters: runtime

  publish:
    needs: [check, docker-crawler, docker-site]
    if: github.ref == 'refs/heads/main'
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    uses: hu553in/common-things/.github/workflows/build-publish-attest-docker.yml@main
    with:
      image: ghcr.io/${{ github.repository }}
      file: ./Dockerfile.spa-crawler
      no_cache_filters: runner
      smoke_command: *python_smoke
