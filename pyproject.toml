[project]
name = "spa-crawler"
version = "0.1.0"
description = "CLI crawler for mirroring modern SPAs and Next.js-style sites into static files."
authors = [{ name = "Ruslan Khasanshin" }]
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
  "crawlee[playwright]",
  "playwright>=1.61.0",
  "rich>=15.0.0",
  "typer>=0.27.0",
  "yarl>=1.24.2",
]

[project.urls]
Repository = "https://github.com/hu553in/spa-crawler"

[dependency-groups]
dev = [
  "bandit>=1.9.4",
  "deptry>=0.25.1",
  "prek>=0.4.10",
  "pysentry-rs>=0.4.7",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.22",
  "ty>=0.0.60",
  "vulture>=2.16",
]

[tool.uv]
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=spa_crawler --cov-report=term-missing --cov-fail-under=95"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "SIM",
  "ARG",
  "PL",
  "RUF",
  "C4",
  "FA",
  "N",
  "PERF",
  "W",
  "PGH004",
  "T10",
]
extend-ignore = ["RUF001", "PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.isort]
known-first-party = ["spa_crawler"]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.pysentry.defaults]
fail_on = "low"

[tool.pysentry.sources]
enabled = ["pypa", "pypi", "osv"]

[tool.deptry]
known_first_party = ["spa_crawler"]

[tool.vulture]
paths = ["spa_crawler", "tests"]
min_confidence = 100
sort_by_size = true

[tool.bandit.assert_used]
skips = ["*_test.py", "*test_*.py"]
